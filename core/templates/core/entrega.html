<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ação Solidária - Entregas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">📦 Ação Solidária</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'cadastrar' %}">Entrada de Doações</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{% url 'entregas' %}">Baixa de Cestas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h4 class="mb-4 text-secondary">Controle de Distribuição</h4>
        <input type="text" class="form-control form-control-lg mb-4 shadow-sm" placeholder="🔍 Buscar família por nome...">
        
        <div class="list-group shadow-sm">
            <div class="list-group-item d-flex justify-content-between align-items-center p-3">
                <div>
                    <h6 class="mb-0 fw-bold">Família Silva</h6>
                    <small class="text-muted">Dependentes: 4 | Bairro CPA</small>
                </div>
                <button class="btn btn-primary btn-lg px-4">Dar Baixa</button>
            </div>
            <div class="list-group-item d-flex justify-content-between align-items-center p-3 bg-light">
                <div>
                    <h6 class="mb-0 text-muted text-decoration-line-through">Família Costa</h6>
                    <small class="text-danger fw-bold">Cesta já retirada este mês</small>
                </div>
                <button class="btn btn-secondary btn-lg px-4" disabled>Bloqueado</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
