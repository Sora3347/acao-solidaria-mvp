<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ação Solidária Bairro a Bairro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .mobile-container {
            max-width: 414px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            min-height: 800px;
            overflow: hidden;
            position: relative;
        }
        .navbar-brand { font-size: 1.1rem; font-weight: bold; }
        .btn-xl { padding: 15px; font-size: 1.1rem; border-radius: 8px; display: block; }
        .card-alerta { border-left: 5px solid #dc3545; }
        .card-aviso { border-left: 5px solid #ffc107; }
        .label-bold { font-weight: 600; color: #495057; margin-bottom: 5px; }
    </style>
</head>
<body>
<div class="mobile-container">
    <nav class="navbar navbar-dark bg-primary px-3">
        <span class="navbar-brand text-white"><i class="fas fa-hands-helping"></i> Ação Solidária</span>
        <a href="#" class="btn btn-sm btn-outline-light"><i class="fas fa-sign-out-alt"></i> Sair</a>
    </nav>

    <div class="p-3">
        <a href="{% url 'entregas' %}" class="btn btn-primary btn-xl w-100 mb-3 text-center text-decoration-none">
            <i class="fas fa-box-open me-2"></i> Nova Entrega de Cesta
        </a>
        <a href="{% url 'cadastrar' %}" class="btn btn-success btn-xl w-100 mb-4 text-center text-decoration-none">
            <i class="fas fa-plus-circle me-2"></i> Cadastrar Doação
        </a>

        <h5 class="mb-3 text-secondary border-bottom pb-2">Alertas de Vencimento</h5>
        
        <div class="card card-alerta mb-3 shadow-sm">
            <div class="card-body">
                <h6 class="card-title fw-bold">Feijão Preto 1kg</h6>
                <p class="card-text mb-2 text-muted small">Quantidade: 15 pacotes</p>
                <span class="badge bg-danger fs-6 p-2 w-100 text-start">
                    <i class="fas fa-exclamation-triangle me-2"></i> Vence amanhã (03/11)
                </span>
            </div>
        </div>

        <div class="card card-aviso mb-3 shadow-sm">
            <div class="card-body">
                <h6 class="card-title fw-bold">Arroz Branco 5kg - Lote B</h6>
                <p class="card-text mb-2 text-muted small">Quantidade: 10 pacotes</p>
                <span class="badge bg-warning text-dark fs-6 p-2 w-100 text-start">
                    <i class="fas fa-clock me-2"></i> Vence em 3 dias (05/11)
                </span>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
